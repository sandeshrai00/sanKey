name: release-sorakey
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release identity
        if: matrix.arch == 'x86_64'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          test "$RELEASE_TAG" = "v$version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libevdev-dev libxtst-dev libxi-dev pkg-config
      - name: Install cross
        if: matrix.arch == 'aarch64'
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz -o /tmp/cross.tar.gz
          tar -xzf /tmp/cross.tar.gz -C /tmp
          sudo mv /tmp/cross /usr/local/bin/cross
          cross --version
      - name: Build sorakey ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            cross build --locked --release --manifest-path daemon/Cargo.toml --target aarch64-unknown-linux-gnu
          else
            cargo build --locked --release --manifest-path daemon/Cargo.toml --target x86_64-unknown-linux-gnu
          fi
          mkdir -p dist
          cp daemon/target/${{ matrix.target }}/release/sorakey dist/sorakey-${{ matrix.arch }}
          (cd dist && sha256sum sorakey-${{ matrix.arch }} > SHA256SUMS-${{ matrix.arch }})
          cat dist/SHA256SUMS-${{ matrix.arch }}
      - name: Attest binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/sorakey-${{ matrix.arch }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sorakey-${{ matrix.arch }}
          path: |
            dist/sorakey-${{ matrix.arch }}
            dist/SHA256SUMS-${{ matrix.arch }}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Merge SHA256SUMS
        run: |
          cat dist/sorakey-*/SHA256SUMS-x86_64 dist/sorakey-*/SHA256SUMS-aarch64 > dist/SHA256SUMS
          sed -i 's|dist/||g' dist/SHA256SUMS
          sort -u -o dist/SHA256SUMS dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sorakey-x86_64/sorakey-x86_64
            dist/sorakey-aarch64/sorakey-aarch64
            dist/SHA256SUMS
          generate_release_notes: true