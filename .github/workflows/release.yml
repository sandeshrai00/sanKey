name: release-sorakey
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          test "$RELEASE_TAG" = "v$version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
          components: rustfmt, clippy
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libevdev-dev libxtst-dev libxi-dev pkg-config libgtk-4-dev
      - name: Build sorakey x86_64
        run: |
          cargo build --locked --release --manifest-path daemon/Cargo.toml
          mkdir -p dist
          cp daemon/target/release/sorakey dist/sorakey-x86_64
          (cd dist && sha256sum sorakey-x86_64 > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Attest binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/sorakey-x86_64"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sorakey-x86_64
            dist/SHA256SUMS
          generate_release_notes: true
